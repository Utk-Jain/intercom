services:
  - type: web
    name: intercom-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./intercom.db
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
